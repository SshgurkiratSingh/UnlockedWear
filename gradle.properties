# Project-wide Gradle settings.

# Memory & JVM Arguments
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2048m

# Performance & Build Cache
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android Gradle Plugin features
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Code Style
kotlin.code.style=official

# KSP settings
ksp.incremental=true

# AGP legacy DSL compatibility for Hilt
android.newDsl=false
android.disallowKotlinSourceSets=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
